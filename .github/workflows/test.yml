name: Tests
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Babashka
        uses: turtlequeue/setup-babashka@v1.8.1
        with:
          babashka-version: 1.3.189

      - name: Babashka version
        run: bb --version

      - name: Run tests
        run: bb test-runner.clj
